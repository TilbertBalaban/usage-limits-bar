[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-limits-bar"
version = "2.0.0"
description = "Claude and Codex usage limits in the macOS menu bar"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tilbert Balaban" }]
requires-python = ">=3.9"
dependencies = ["pyobjc-framework-Cocoa>=9.0", "certifi"]

[project.urls]
Homepage = "https://github.com/TilbertBalaban/usage-limits-bar"

[project.scripts]
usage-limits-bar = "usage_limits_bar.cli:main"

[tool.setuptools]
packages = ["usage_limits_bar"]
